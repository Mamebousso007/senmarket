[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senmarket"
version = "0.1.0"
description = "Fil rouge SenMarket : génération, nettoyage et analyse de données (Module 0)"
requires-python = ">=3.11,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
